<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 AI 인재전략 조찬포럼 - 신청 마감</title>
<style>
  :root {
    --navy-950: #0a0d14;
    --navy-900: #12161f;
    --navy-700: #262e40;
    --gold-400: #cda869;
    --gold-300: #e8d4a6;
    --ink-100: #f2ede1;
    --ink-400: #98a0b3;
    --font-body: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy-950);
    color: var(--ink-100);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  body {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    padding: 48px 32px;
    background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
    border: 1px solid var(--navy-700);
  }
  .mark {
    width: 52px; height: 52px;
    margin: 0 auto 22px;
    border: 1.5px solid var(--gold-400);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 22px; height: 22px; stroke: var(--gold-400); }
  p.msg {
    font-size: 18px;
    line-height: 1.8;
    color: var(--ink-100);
    margin: 0;
  }
  p.msg a { color: var(--gold-300); text-decoration: none; }
  p.msg a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
  <p class="msg">신청이 마감됐습니다.<br>기타 문의는 <a href="mailto:yrna@wjthinkbig.com">yrna@wjthinkbig.com</a>으로 연락 부탁드립니다.</p>
</div>

</body>
</html>
