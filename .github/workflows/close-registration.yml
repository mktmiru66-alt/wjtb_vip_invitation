name: Close registration form

on:
  schedule:
    # 2026-08-31 18:00 KST = 2026-08-31 09:00 UTC
    - cron: '0 9 31 8 *'
  workflow_dispatch: {}

jobs:
  close-form:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace index.html with closed notice
        run: cp closed.html index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Close registration form (scheduled)"
            git push
          fi
